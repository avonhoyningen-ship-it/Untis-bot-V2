name: Vertretungsplan Check

on:
  schedule:
    - cron: "*/5 4-21 * * 0-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install webuntis requests

      - name: Run check
        env:
          UNTIS_SCHOOL: ${{ secrets.UNTIS_SCHOOL }}
          UNTIS_USERNAME: ${{ secrets.UNTIS_USERNAME }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          UNTIS_SERVER: ${{ secrets.UNTIS_SERVER }}
          UNTIS_CLASS: ${{ secrets.UNTIS_CLASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_untis.py

      - name: Commit new state
        run: |
          git config user.name "untis-bot"
          git config user.email "untis-bot@users.noreply.github.com"
          git add last_state.json
          git diff --quiet --cached || git commit -m "Update state [skip ci]"
          git push
